<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070711" />
  <meta name="robots" content="noindex" />
  <title>Message received — Ojaskara Studio</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.25rem; color: #f5f4ff; background: radial-gradient(circle at 50% 30%, rgba(131,119,255,.2), transparent 28rem), #070711; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100%, 560px); text-align: center; padding: clamp(2rem, 7vw, 4.5rem); border: 1px solid rgba(255,255,255,.1); border-radius: 28px; background: rgba(17,17,42,.74); box-shadow: 0 28px 100px rgba(0,0,0,.35); }
    .mark { width: 72px; aspect-ratio: 1; display: grid; place-items: center; margin: 0 auto 1.5rem; border-radius: 22px; color: #35d8ff; font-size: 2rem; background: linear-gradient(145deg, rgba(131,119,255,.25), rgba(53,216,255,.08)); border: 1px solid rgba(131,119,255,.45); box-shadow: 0 0 45px rgba(53,216,255,.18); }
    .kicker { color: #f3b45b; text-transform: uppercase; letter-spacing: .18em; font-size: .72rem; font-weight: 750; }
    h1 { margin: .8rem 0 1rem; font-size: clamp(2.2rem, 8vw, 4rem); line-height: 1; letter-spacing: -.055em; }
    p { color: #a09db8; line-height: 1.7; }
    a { display: inline-flex; margin-top: 1.2rem; padding: .8rem 1.1rem; border-radius: 12px; color: #090914; background: linear-gradient(120deg, #a097ff, #55dfff); text-decoration: none; font-weight: 750; }
  </style>
</head>
<body>
  <main><div class="mark" aria-hidden="true">◇</div><span class="kicker">Message received</span><h1>Thanks for sharing.</h1><p>Your feedback is on its way to Ojaskara Studio. We appreciate you taking the time to help us build more thoughtful experiences.</p><a href="/">Back to the studio</a></main>
</body>
</html>
